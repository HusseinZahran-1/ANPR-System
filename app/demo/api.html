<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jordan ANPR | API console</title>
  <style>
    :root { color-scheme: dark; --bg: #07131b; --card: #10212a; --line: #25404a; --text: #f3f7f4; --muted: #a9bdc2; --accent: #58dbc1; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at 90% 0, #163944 0, transparent 58%), var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", sans-serif; }
    main { max-width: 1050px; margin: auto; padding: 28px 20px 60px; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 24px; }
    nav strong { margin-right: auto; }
    a { color: var(--accent); }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 16px; }
    h2 { font-size: 1.25rem; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { min-width: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--card); padding: 20px; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; color: var(--muted); }
    input:not([type=checkbox]) { width: 100%; color: var(--text); background: var(--bg); border: 1px solid #3d626a; border-radius: 8px; padding: 9px; font: inherit; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button { width: fit-content; border: 0; border-radius: 8px; background: var(--accent); color: #09241e; padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { color: var(--text); background: #28484e; }
    button:disabled { opacity: .6; cursor: wait; }
    .checkbox { display: flex; align-items: center; gap: 8px; }
    p, small { color: var(--muted); }
    pre, output { display: block; overflow: auto; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 8px; }
    [hidden] { display: none; }
    #response { max-height: 300px; }
    #key-list { padding: 0; list-style: none; }
    #key-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; overflow-wrap: anywhere; padding: 6px 0; border-top: 1px solid var(--line); }
    @media (max-width: 730px) { .grid { grid-template-columns: 1fr; } }
  </style>
  <script src="/assets/api.js" defer></script>
</head>
<body>
<main>
  <nav aria-label="Main navigation">
    <strong><a href="/">JORDAN ANPR</a></strong>
    <a href="/demo">Image demo</a>
    <a href="/live">Live camera</a>
    <a href="/docs">OpenAPI</a>
    <a href="/settings">Settings</a>
  </nav>
  <h1>API console</h1>
  <div class="grid">
    <section class="card">
      <h2>Manage inference keys</h2>
      <form id="generate">
        <label>Administrator key
          <input id="admin" type="password" autocomplete="off" required>
        </label>
        <small>Use the operator's INFERENCE_ADMIN_KEY from the local service configuration.</small>
        <label>Key name
          <input id="label" maxlength="80" placeholder="Garage backend" required>
        </label>
        <div class="row">
          <button type="submit">Generate API key</button>
          <button type="button" class="secondary" id="load">Load keys</button>
        </div>
      </form>
      <p id="manage-status" role="status"></p>
      <output id="new-key" hidden></output>
      <ul id="key-list" aria-label="Issued keys"></ul>
    </section>
    <section class="card">
      <h2>Test an inference request</h2>
      <form id="try-request">
        <label>Inference API key
          <input id="api-key" type="password" autocomplete="off" required>
        </label>
        <label>JPEG or PNG image
          <input id="scene" type="file" accept="image/jpeg,image/png" required>
        </label>
        <label class="checkbox">
          <input id="save-xml" type="checkbox"> Save image and XML on this server
        </label>
        <button type="submit">Send test request</button>
      </form>
      <p id="request-status" role="status"></p>
      <pre id="response" hidden></pre>
      <h2>cURL example</h2>
      <pre id="example"></pre>
    </section>
  </div>
</main>
</body>
</html>
